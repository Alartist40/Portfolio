vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec3 permute(vec3 x) { return mod289(((x * 34.0) + 1.0) * x); }

float snoise(vec2 v) {
  const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
  vec2 i = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod289(i);
  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
  vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0);
  m = m * m;
  m = m * m;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
  vec3 g;
  g.x = a0.x * x0.x + h.x * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}

float fbm(vec2 p) {
  float value = 0.0;
  float amplitude = 0.5;
  float frequency = 1.0;
  for (int i = 0; i < 5; i++) {
    value += amplitude * snoise(p * frequency);
    frequency *= 2.0;
    amplitude *= 0.5;
  }
  return value;
}

hero:{label:"FORWARD DEPLOYED & SYSTEMS AI ENGINEER",titleLine1:"I design resilient systems",titleLine2:"and engineer them from the metal up.",subtitle:"From low-overhead Rust LLM streaming runtimes (70B models at 1.1GB RAM) and production healthcare backends (11,133 records migrated) to autonomous robotics and synaptic graph memory. 10+ projects engineered. Based in Japan.",ctaProjects:"View Projects",ctaContact:"Get in Touch",scroll:"Scroll"},work:{label:"FLAGSHIP PROJECTS",heading:"From concept to high-performance systems",subtext:"7 production and open-source systems engineered with depth and precision",viewDetails:"View details →",projects:[{num:"PROJECT 01",title:"Cynapse",slug:"cynapse",description:"High-performance, offline-first AI agent platform engineered in 100% pure Rust. Features the 4-tier Dendrite SQLite FTS5 graph memory, Leafcutter tensor execution core, 3D orbital galaxy visualization, and an interactive retro TUI harness. 301 verified tests passing.",tags:["Rust","AI Agent","Graph Memory","TUI","Offline-First"]},{num:"PROJECT 02",title:"LeafcutterLLM",slug:"leafcutterllm",description:"Memory-first adaptive LLM runtime written entirely in 100% Rust. Runs 1.5B to 70B parameter models on commodity CPUs without discrete GPUs via 3-tier streaming execution, achieving 1.1GB peak RAM on Llama-3.1-70B and 21.6x speedup over AirLLM.",tags:["Rust","LLM Engine","SIMD","Open Source","Sub-1GB RAM"]},{num:"PROJECT 03",title:"E&P Medical Management System",slug:"ep-medical",description:"Production healthcare practice management platform deployed at E&P Medical Centre in Botswana. Fully replaced a legacy 96MB Microsoft Access database, flawlessly migrating 89 tables and 11,133 patient records to a zero-dependency Rust and SQLite single binary.",tags:["Rust","SQLite","Healthcare Production","Data Migration","Axum"]},{num:"PROJECT 04",title:"The Pathfinder Eye",slug:"pathfinder-eye",description:"Autonomous robotics platform with native Go/Rust brain, omnidirectional mecanum locomotion, face recognition security authority, and real-time YOLO vision at 30fps with multimodal AI reasoning on Raspberry Pi 5.",tags:["Rust","Go","Robotics","Computer Vision","Raspberry Pi 5"]},{num:"PROJECT 05",title:"Paraclea",slug:"paraclea",description:"Pure Rust offline AI companion and intelligent librarian engine. Features personalized Dendrite v2 knowledge graph memory, 219 Bible translations across 30 languages, 211-chapter spiritual/survival/medical library, and Reticulum LoRa off-grid mesh communications.",tags:["Rust","AI Librarian","Knowledge Engine","Reticulum Mesh"]},{num:"PROJECT 06",title:"Mazzaroth",slug:"mazzaroth",description:"Pure Rust offline digital knowledge vault and source-verified research engine for single-board computers. Delivers sub-millisecond BM25 full-text indexing, offline vector search, 62 countries of geopolitical maps, and an interactive 1,105-node 3D knowledge graph.",tags:["Rust","Offline Knowledge Vault","BM25 Search","3D Graph","SBC"]},{num:"PROJECT 07",title:"Hikarigo",slug:"hikarigo",description:"Privacy-first, open-source language learning and cognitive study platform built in Go and clean HTML/CSS. Delivers zero-tracking SM-2 spaced repetition, instant vocabulary recall, and local-first data ownership with sub-10ms response times.",tags:["Go","Privacy-First","Educational Platform","Spaced Repetition","SQLite"]}]},about:{label:"ABOUT ME",heading:"Bridging design thinking, hardware craft, and deep systems engineering",intro1:"I am a Forward Deployed & Systems AI Engineer who builds mission-critical systems from the metal up. I identify workflow bottlenecks in real-world environments, architect resilient software and low-latency runtimes, and ship production-grade code in Rust, Go, and Python. Fluent in Spanish and English with conversational Japanese, I have led cross-functional technical initiatives and humanitarian missions across Africa, Japan, and the Americas.",intro2:"Currently based in Japan (completing an AI Systems Diploma at Chuo Computer & Communication College in March 2027), I combine high-performance systems engineering, single-board computers (Raspberry Pi / Orange Pi / ESP32), additive manufacturing (3D CAD prototyping), and offline-first autonomous AI agents to build complete, functional products from concept to production deployment.",pillarsHeading:"AREAS OF EXPERTISE & LEADERSHIP",pillars:[{num:"PILLAR 01",title:"Production Systems & Arch Linux Infrastructure",description:"Operating on Arch Linux as daily driver. Engineered multi-crate pure Rust workspaces, high-concurrency Axum/Tokio web backends, and low-latency background daemons. Demonstrated zero-loss data migration of 11,133 patient records from legacy Access to modern SQLite, containerized with Docker/Podman.",tags:["Arch Linux","Rust Multi-Crate","Docker/Podman","Systemd Daemons","Zero-Loss Migration"]},{num:"PILLAR 02",title:"Robotics Education & Global Event Leadership",description:"Experienced educator and community leader. Led and taught hands-on robotics, programming, and maker workshops to children and adults of diverse multicultural backgrounds across multiple events. Directed and coordinated week-long technical events and humanitarian initiatives across 3 continents.",tags:["Robotics Teaching","Multicultural Education","Week-Long Event Management","3 Continents","Team Leadership"]},{num:"PILLAR 03",title:"Single-Board Computers & Microcontrollers",description:"Extensive hands-on engineering across single-board computers and microchips: from Raspberry Pi 5 and Pi Zero 2W to Orange Pi 6 Plus and ESP32 chips (ESP32-S3 Sense, ESP32-C3). Proficient in hardware interfacing, low-latency firmware, I2C/SPI protocols, and edge Linux optimization.",tags:["Raspberry Pi 5","Raspberry Pi Zero 2W","Orange Pi 6 Plus","ESP32-S3 Sense","ESP32-C3","Embedded Hardware"]},{num:"PILLAR 04",title:"Self-Taught 3D Printing & Rapid Prototyping",description:"Self-taught in 3D CAD modeling, slicing, and additive manufacturing. Capable of designing custom robotic chassis, sensor mounting brackets, and custom device enclosures, iteratively testing and refining physical prototypes from raw ideas into functional hardware.",tags:["3D Printing","CAD Design","Iterative Prototyping","Hardware Fabrication","Enclosure Design"]},{num:"PILLAR 05",title:"Interactive 3D Systems, Animation & Game Design",description:"Merging visual aesthetics with low-level computation. Engineered interactive 3D visualizers like the Dendrite 3D Orbital Galaxy Memory Atlas in Cynapse, crafted unique modern user interfaces, and combined design architecture with programming logic to develop complete games.",tags:["3D Galaxy Animation","Game Development","UX/UI Architecture","Figma","Interactive Prototyping"]}],skillsHeading:"TECHNICAL STACK & METHODOLOGIES",skills:[{category:"Systems & Core Programming",items:"Rust (100% pure cores, Axum, Tokio, Rusqlite), Go, Python, C++, SIMD Vectorization (ARM NEON / AVX2), SQLite FTS5, Linux (Arch Linux daily driver, Bash, CLI tools), Docker, Podman"},{category:"AI Engineering & Credentials",items:"SIGNATE Cloud Level 63 (879 cleared exercises: scikit-learn, Python, AI Ethics & Law), Anthropic Claude 101, Generative AI Passport (生成AIパスポート), GBNF Grammars, LLM Quantization & Streaming Inference"},{category:"Hardware & Embedded Robotics",items:"Raspberry Pi 5, Pi Zero 2W, Orange Pi 6 Plus, ESP32-S3 Sense, ESP32-C3, I2C/SPI Protocols, Mecanum Locomotion, YOLO Vision (30fps), 3D CAD & Additive Prototyping"},{category:"Spoken Languages & Human Leadership",items:"Spanish (Native), English (Business Level), Japanese (Conversational / studying for JLPT N2), French (Basic study), Japanese Red Cross First Aid Certified (赤十字救急法短期講習修了)"}],stats:[{num:"11,133",label:"Records Migrated"},{num:"1.1 GB",label:"RAM for 70B Model"},{num:"301",label:"Rust Tests Passed"},{num:"Lv. 63",label:"SIGNATE Cloud (879+ Ex)"}],timelineHeading:"ACADEMIC & PROFESSIONAL JOURNEY",timeline:[{period:"2025 – 2027",title:"Chuo Computer & Communication College (中央情報専門学校)",role:"Associate Degree / Senmonshi (専門士) in AI Systems",desc:"Expected graduation March 31, 2027. Specializing in computer science, low-level inference runtimes, edge robotics, and autonomous agent architectures. Full work visa sponsorship parity under Japanese Immigration Law."},{period:"2023 – 2025",title:"ISI Language School, Takadanobaba, Tokyo (ISIランゲージスクール 高田馬場校)",role:"Japanese Language Immersion",desc:"Graduated March 2025. Intensive Japanese language training, intercultural communication, and professional conduct."},{period:"2020 – 2023",title:"Dalian Medical University (大連医科大学, China)",role:"Clinical Medicine & Physiological Systems",desc:"Completed June 2023. Acquired deep clinical intuition in interconnected biological systems, pharmacology, and high-pressure emergency care."},{period:"2018 – 2019",title:"South Western University (Philippines)",role:"Pre-Medical Curriculum",desc:"Undergraduate pre-medical coursework in Cebu before transferring to Dalian Medical University in 2020."},{period:"2014 – 2017",title:"Gaborone International School (Botswana)",role:"Secondary Education Graduate",desc:"Multilingual international schooling foundation in Southern Africa."},{period:"2018 – 2023",title:"E&P Medical Centre (Gaborone, Botswana)",role:"Medical Administration & Core IT Systems Modernizer",desc:"Handled clinical reception, triage intake, and spearheaded modernization of clinic infrastructure: successfully migrated 89 tables and 11,133 records from Access to an air-gapped Rust/SQLite single-binary system."}],volunteerHeading:"VOLUNTEER & HUMANITARIAN LEADERSHIP",volunteerSubtext:"Over a decade of hands-on youth technology education, international camp operations, and overseas medical triage and surgical support across 3 continents.",volunteerCategories:[{category:"Community & Educational Leadership in Japan (Tokyo International Church & Beyond / 2025–2026)",items:["Planned and instructed classes in crafts, survival skills, filmmaking, programming, and robotics for children and adults","Managed event planning and operations, youth camp coordination, and safety management","Directed media and public relations: designed posters, video thumbnails, and website architecture","Served as a bilingual English-Japanese interpreter supporting multi-generational and international community activities"]},{category:"Technical & Engineering Leadership (CCMC / 2025–2026)",items:["Led robotics architectural strategy and design decisions for the robotics development team at Chuo Computer & Communication College (CCMC)","Supported and consulted on robotics manufacturing and coding projects across classes and departments","Mentored classmates in software development workflows, tooling, and low-level engineering"]},{category:"Global Medical & Community Outreach (Botswana & Philippines / 2015, 2018–2019)",items:["Botswana (2015): Accompanied multidisciplinary medical team at age 15; conducted health checkups for 100+ community members including blood pressure, pulse, and ABO/Rh blood typing","Leyte Island, Philippines (2018–2019): Trekked 6+ hours through mountainous terrain to deliver essential medicine to remote indigenous settlements; supported field consultations and care as part of medical team","Mindanao, Philippines (2018–2019): Supported medical triage, vital sign monitoring, and diagnostic blood typing as part of mobile healthcare team","Philippines (2018–2019): Clinical assistance in surgical suturing, wound dressing/gauze management, and circumcision surgical support (German and Philippine methods)","Cebu, Philippines (2018–2019): Environmental cleanup and community beautification initiatives"]}]},contact:{label:"CONTACT",heading:"Let's engineer something extraordinary.",subtext:"Open to Forward Deployed Engineering, AI Systems, Backend, and Robotics opportunities in Japan.",email:"c250469@ccg.ac.jp",github:"GitHub",linkedin:"LinkedIn"},footer:{name:"ROMERO ALEJANDRO",year:"2026"}},jp:{nav:{name:"ROMERO ALEJANDRO",work:"作品",about:"自己紹介",contact:"連絡先"},hero:{label:"フォワードデプロイド ＆ システムAIエンジニア",titleLine1:"洗練された堅牢なシステムを設計し、",titleLine2:"低レイヤの基盤から極限まで実装する。",subtitle:"1.1GB RAMで70Bモデルを推論する純粋Rust製ストリーミング基盤から、11,133件の患者データを移行・実運用した医療機関バックエンド、自律ロボティクス、シナプス型グラフメモリまで。10以上の独自プロジェクトを開発。現在、日本を拠点に活動中。",ctaProjects:"作品を見る",ctaContact:"連絡する",scroll:"スクロール"},work:{label:"主要プロジェクト",heading:"構想から高性能システムへ",subtext:"妥協のない設計と高い技術力で構築された7つのフラッグシップ作品",viewDetails:"詳細を見る →",projects:[{num:"プロジェクト 01",title:"Cynapse",slug:"cynapse",description:"100%純粋なRustで開発された高性能・完全オフライン対応の自律型AIエージェントプラットフォーム。4層Dendrite SQLite FTS5グラフメモリ、Leafcutterテンソル実行コア、3D銀河軌道ビジュアライザ、対話型レトロTUIハーネスを搭載。単体・結合テスト301件合格。",tags:["Rust","AIエージェント","グラフメモリ","TUI","完全オフライン"]},{num:"プロジェクト 02",title:"LeafcutterLLM",slug:"leafcutterllm",description:"100%純粋なRustで構築されたメモリ最適化適応型LLMランタイム。3層ストリーミング機構により、ディスクリートGPU不要で40.3GBの70BモデルをピークRAMわずか1.1GBで推論。Qwen2.5-1.5B推論でAirLLM比21.6倍の高速化を実証。",tags:["Rust","LLMエンジン","SIMD","オープンソース","省メモリ推論"]},{num:"プロジェクト 03",title:"E&P Medical Management System",slug:"ep-medical",description:"ボツワナ共和国の民間診療所にて実運用中の医療機関向け基幹業務システム。レガシーな96MBのMicrosoft Accessデータベースから89テーブル・11,133件の患者データを完全移行。外部依存ゼロのRust製単一バイナリとSQLiteで本番稼働。",tags:["Rust","SQLite","医療本番稼働","データ移行","Axum"]},{num:"プロジェクト 04",title:"The Pathfinder Eye",slug:"pathfinder-eye",description:"ネイティブGo/Rustの頭脳、全方向メカナム移動、顔認識セキュリティ権限管理、Raspberry Pi 5上で30fps動作するリアルタイムYOLOビジョン、マルチモーダルAI推論を搭載した自律型ロボティクスプラットフォーム。",tags:["Rust","Go","ロボティクス","コンピュータビジョン","Raspberry Pi 5"]},{num:"プロジェクト 05",title:"Paraclea",slug:"paraclea",description:"純粋なRustによる完全オフラインAIコンパニオン兼インテリジェント司書エンジン。パーソナライズされたDendrite v2知識グラフメモリ、30言語219版の聖書データベース、211章に及ぶサバイバル・医療・専門ライブラリ、Reticulum LoRaメッシュ通信を統合。",tags:["Rust","AI司書","知識エンジン","Reticulumメッシュ"]},{num:"プロジェクト 06",title:"Mazzaroth",slug:"mazzaroth",description:"シングルボードコンピュータ向けに純粋Rustで開発された完全オフライン知識金庫＆研究エンジン。サブミリ秒のBM25全文検索、オフラインベクトル探索、62カ国の地政学オフライン地図、1,105ノードの対話型3D知識グラフを内包。",tags:["Rust","オフライン知識金庫","BM25検索","
