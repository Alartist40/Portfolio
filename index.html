vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec3 permute(vec3 x) { return mod289(((x * 34.0) + 1.0) * x); }

float snoise(vec2 v) {
  const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
  vec2 i = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod289(i);
  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
  vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0);
  m = m * m;
  m = m * m;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
  vec3 g;
  g.x = a0.x * x0.x + h.x * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}

float fbm(vec2 p) {
  float value = 0.0;
  float amplitude = 0.5;
  float frequency = 1.0;
  for (int i = 0; i < 5; i++) {
    value += amplitude * snoise(p * frequency);
    frequency *= 2.0;
    amplitude *= 0.5;
  }
  return value;
}

m Mesh"]},{num:"PROJECT 04",title:"The Pathfinder Eye",slug:"pathfinder-eye",description:"Autonomous robotics platform with native Go/Rust brain, omnidirectional mecanum locomotion, face recognition security authority, and real-time YOLO vision at 30fps with multimodal AI reasoning.",tags:["Rust","Go","Robotics","Computer Vision"]}]},about:{label:"ABOUT ME",heading:"Bridging design thinking, hardware craft, and deep systems engineering",intro1:"I am a UX designer who learned to build systems from the metal up. I identify workflow bottlenecks, design intuitive user interfaces and resilient architectures, and ship production-grade code in Rust, Go, and Python. Fluent in Spanish and English with conversational Japanese (N3 level), I have led cross-functional teams across Africa, Japan, and the Americas.",intro2:"Currently based in Japan, I combine low-level hardware prototyping, single-board computing, additive manufacturing, 3D graphic systems, and autonomous AI agents to build complete, functional products from concept to execution.",pillarsHeading:"AREAS OF EXPERTISE & LEADERSHIP",pillars:[{num:"PILLAR 01",title:"Robotics Education & Global Event Leadership",description:"Experienced educator and community leader. Led and taught hands-on robotics and programming classes to children and adults of diverse cultural and ethnic backgrounds across multiple events. Directed and coordinated week-long technical events and multi-continent initiatives.",tags:["Robotics Teaching","Multicultural Education","Week-Long Event Management","3 Continents","Team Leadership"]},{num:"PILLAR 02",title:"Single-Board Computers & Microcontrollers",description:"Extensive hands-on engineering across single-board computers and microchips: from Raspberry Pi 5 and Pi Zero 2W to Orange Pi 6 Plus and ESP32 chips (ESP32-S3 Sense, ESP32-C3). Proficient in hardware interfacing, low-latency firmware, I2C/SPI protocols, and edge Linux optimization.",tags:["Raspberry Pi 5","Raspberry Pi Zero 2W","Orange Pi 6 Plus","ESP32-S3 Sense","ESP32-C3","Embedded Hardware"]},{num:"PILLAR 03",title:"Self-Taught 3D Printing & Rapid Prototyping",description:"Self-taught in 3D CAD modeling, slicing, and additive manufacturing. Capable of designing custom robotic chassis, sensor mounting brackets, and custom device enclosures, iteratively testing and refining physical prototypes from raw ideas into functional hardware.",tags:["3D Printing","CAD Design","Iterative Prototyping","Hardware Fabrication","Enclosure Design"]},{num:"PILLAR 04",title:"Interactive 3D Systems, Animation & Game Design",description:"Merging visual aesthetics with low-level computation. Engineered interactive 3D visualizers like the Dendrite 3D Orbital Galaxy Memory Atlas in Cynapse, crafted unique modern user interfaces, and combined design architecture with programming logic to develop complete games.",tags:["3D Galaxy Animation","Game Development","UX/UI Architecture","Figma","Interactive Prototyping"]}],skillsHeading:"TECHNICAL STACK & METHODOLOGIES",skills:[{category:"Systems & AI Engineering",items:"Rust (100% pure cores), Go, Python, SIMD Vectorization, Graph Memory (SQLite FTS5), Linux, Docker, Podman"},{category:"Hardware & Embedded Computing",items:"Raspberry Pi 5, Pi Zero 2W, Orange Pi 6 Plus, ESP32-S3 Sense, ESP32-C3, I2C/SPI, Embedded Linux"},{category:"Physical Prototyping & 3D Fabrication",items:"3D Printing (FDM/Resin), CAD Modeling, Rapid Mechanical Prototyping, Sensor Integration, Chassis Fabrication"},{category:"Design, Animation & Creative",items:"UI/UX Architecture, 3D & Galactic Visualization, Game Design, Interactive Prototyping, Video & Media Production"}],stats:[{num:"10+",label:"Projects Built"},{num:"3",label:"Continents Led"},{num:"SBC & MCU",label:"Hardware Platforms"},{num:"200+",label:"Passing Tests"}]},contact:{label:"CONTACT",heading:"Let's build something remarkable.",subtext:"Open to UX design, systems architecture, and engineering opportunities in Japan.",email:"c250469@ccg.ac.jp",github:"GitHub",linkedin:"LinkedIn"},footer:{name:"ROMERO ALEJANDRO",year:"2026"}},jp:{nav:{name:"ROMERO ALEJANDRO",work:"作品",about:"自己紹介",contact:"連絡先"},hero:{label:"UXデザイナー ＆ システムエンジニア",titleLine1:"洗練された体験をデザインし、",titleLine2:"最高峰のコードで実装する。",subtitle:"直感的なUXデザインから超高速Rust製LLMランタイム、自律走行ロボット、シナプス型AIメモリシステムまで。10以上の独自プロジェクトを開発。現在、日本を拠点に活動中。",ctaProjects:"作品を見る",ctaContact:"連絡する",scroll:"スクロール"},work:{label:"主要プロジェクト",heading:"構想から高性能システムへ",subtext:"妥協のない設計と高い技術力で構築された4つのフラッグシップ作品",viewDetails:"詳細を見る →",projects:[{num:"プロジェクト 01",title:"Cynapse",slug:"cynapse",description:"100%純粋なRustで開発された高性能・完全オフライン対応のAIエージェントプラットフォーム。4層Dendrite SQLite FTS5グラフメモリ、Leafcutterテンソル実行コア、3D銀河軌道ビジュアライザ、対話型レトロTUIハーネスを搭載。",tags:["Rust","AIエージェント","グラフメモリ","TUI"]},{num:"プロジェクト 02",title:"LeafcutterLLM",slug:"leafcutterllm",description:"100%純粋なRustで構築されたメモリ最適化適応型LLMランタイム。3層ストリーミング実行、ハードウェア自動検知、SIMDアクセラレーションにより、GPU不要で一般的なCPU上で15億〜700億パラメータのモデルを実行。",tags:["Rust","LLMエンジン","SIMD","オープンソース"]},{num:"プロジェクト 03",title:"Paraclea",slug:"paraclea",description:"純粋なRustによる完全オフラインAIコンパニオン兼インテリジェント司書エンジン。パーソナライズされたDendrite v2知識グラフメモリ、30言語219版の聖書データベース、211章に及ぶサバイバル・医療・専門ライブラリ、オフグリッド通信を統合。",tags:["Rust","AI司書","知識エンジン","Reticulumメッシュ"]},{num:"プロジェクト 04",title:"The Pathfinder Eye",slug:"pathfinder-eye",description:"ネイティブGo/Rustの頭脳、全方向メカナム移動、顔認識セキュリティ権限管理、30fpsのリアルタイムYOLOビジョン、マルチモーダルAI推論を搭載した自律型ロボティクスプラットフォーム。",tags:["Rust","Go","ロボティクス","コンピュータビジョン"]}]},about:{label:"自己紹介",heading:"デザイン思考、ハードウェア技術、深層システム工学の融合",intro1:"私は、ハードウェアの基盤からシステム全体を構築できるUXデザイナーです。ワークフローの課題を特定し、直感的なUIと堅牢なアーキテクチャを設計し、Rust、Go、Pythonで製品レベルのコードを提供します。スペイン語と英語はネイティブレベル、日本語は日常会話（JLPT N3レベル）。アフリカ、日本、アメリカの3大陸で多国籍チームを率いてきました。",intro2:"現在は日本を拠点に、シングルボードコンピュータ、マイコン、3Dプリンティングによるハードウェア試作、3Dグラフィック・アニメーション、自律型AIエージェントを融合させ、構想から完成まで一貫したプロダクト開発を行っています。",pillarsHeading:"専門領域 ＆ リーダーシップ実績",pillars:[{num:"領域 01",title:"ロボティクス指導 ＆ 大規模イベント統括",description:"豊富な教育・指導実績。子どもから大人まで多様な国籍・文化背景を持つ生徒を対象に、複数のイベントでロボティクスやプログラミングの実践講座を主導・指導。また、1週間に及ぶ大規模技術イベントの企画・運営や3大陸にわたる多国籍プロジェクトを統括。",tags:["ロボティクス教室指導","多国籍・多文化教育","週間イベント運営","3大陸統括","チームリーダーシップ"]},{num:"領域 02",title:"シングルボードコンピュータ（SBC）＆ マイコン開発",description:"SBCおよびマイコンにおける豊富な実機開発実績：Raspberry Pi 5、Pi Zero 2W、Orange Pi 6 Plus、ESP32シリーズ（ESP32-S3 Sense、ESP32-C3）。低遅延ファームウェア、I2C/SPI通信、センサー統合、エッジLinux最適化に精通。",tags:["Raspberry Pi 5","Raspberry Pi Zero 2W","Orange Pi 6 Plus","ESP32-S3 Sense","ESP32-C3","組み込みハードウェア"]},{num:"領域 03",title:"独学による3Dプリンティング ＆ 迅速な試作検証",description:"3D CADモデリングからスライス、3Dプリント製造までを独学で習得。ロボットシャーシ、センサーマウント、専用デバイスケースを自ら設計し、物理的なプロトタイプの迅速な試作と反復検証を実行可能。",tags:["3Dプリント","CAD設計","反復プロトタイピング","筐体設計","ハードウェア製作"]},{num:"領域 04",title:"対話型3Dシステム、アニメーション ＆ ゲーム開発",description:"視覚表現と低レイヤープログラミングの融合。Cynapse/Dendriteにおける3D軌道銀河メモリアトラスのリアルタイム可視化、独自UIシステムの設計、デザインとプログラミングを融合させたゲーム開発を実現。",tags:["3D銀河アニメーション","ゲーム開発","UI/UXアーキテクチャ","Figma","インタラクティブ試作"]}],skillsHeading:"技術スタック ＆ 手法",skills:[{category:"システム ＆ AIエンジニアリング",items:"Rust（100%純粋コア）、Go、Python、SIMD最適化、グラフメモリ（SQLite FTS5）、Linux、Docker、Podman"},{category:"ハードウェア ＆ 組み込み開発",items:"Raspberry Pi 5、Pi Zero 2W、Orange Pi 6 Plus、ESP32-S3 Sense、ESP32-C3、I2C/SPI、組み込みLinux"},{category:"物理プロトタイピング ＆ 3D造形",items:"3Dプリンティング（FDM/光造形）、CADモデリング、迅速な機構試作、センサー統合、筐体製作"},{category:"デザイン、アニメーション ＆ クリエイティブ",items:"UI/UXアーキテクチャ、3D・銀河可視化、ゲーム設計、インタラクティブプロトタイピング、映像制作"}],stats:[{num:"10+",label:"開発プロジェクト"},{num:"3",label:"指導・統括大陸"},{num:"SBC/MCU",label:"ハードウェア対応"},{num:"200+",label:"テスト合格"}]},contact:{label:"連絡先",heading:"革新的なシステムを共に創り出しましょう。",subtext:"日本国内でのUXデザイン、システムアーキテクチャ、エンジニアリングの機会を歓迎します。",email:"c250469@ccg.ac.jp",github:"GitHub",linkedin:"LinkedIn"},footer:{name:"ROMERO ALEJANDRO",year:"2026"}}},hP={cynapse:{en:{architecture:["100% Pure Rust Multi-Crate Architecture: Decoupled modular workspace comprising cynapse-harness, cynapse-tui, cynapse-core, cynapse-memory, cynapse-engine, and leafcutter_core for blazing speed and zero memory leaks","Dendrite 4-Tier Synaptic Graph Memory: SQLite FTS5 full-text indexing + BM25 relevance ranking that organically for
